name: Release

# Triggered by pushing a version tag, never automatically on merge — releasing is a decision, not a
# side effect of merging (ADR-0009).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  bundle:
    name: Build, verify and publish the all-in-one bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # The tag is the source of truth for what gets published (git-workflow-and-versioning), so a
      # tag that disagrees with what is actually checked out must stop the release rather than ship
      # a ZIP labelled with the wrong version. Cheap, so it runs before anything else.
      - name: Verify the tag matches package.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for pkg in package.json backend/package.json frontend/package.json shared/package.json; do
            PKG_VERSION=$(node -p "require('./$pkg').version")
            if [ "$PKG_VERSION" != "$VERSION" ]; then
              echo "::error::$pkg is at $PKG_VERSION, but the tag says $VERSION. Bump the version" \
                   "(npm run version:set -- $VERSION) and re-tag before releasing."
              exit 1
            fi
          done

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build all workspaces
        run: npm run build

      # Assemble exactly what an operator needs and nothing else: no specs, no ADRs, no tests, no
      # source, no dev dependencies, and — deliberately — no node_modules and no copy of Node itself.
      # install-dependencies.bat resolves those dynamically on the operator's machine (ADR-0009).
      - name: Assemble bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE="bundle/chicken-dinner-feed-$VERSION"
          mkdir -p "$BUNDLE"/{backend/data/defaults,shared,docs}

          # Backend: compiled output only.
          cp -r backend/dist "$BUNDLE/backend/dist"
          cp backend/.env.example "$BUNDLE/backend/.env.example"
          if [ -d backend/data/defaults ]; then
            cp -r backend/data/defaults/. "$BUNDLE/backend/data/defaults/"
          fi

          # Frontend: built assets, served by the backend from backend/public.
          cp -r frontend/dist "$BUNDLE/backend/public"

          # Shared contracts, linked as a local file: dependency so npm resolves it normally.
          cp -r shared/dist "$BUNDLE/shared/dist"
          cp shared/package.json "$BUNDLE/shared/package.json"

          # Operator entry points and documentation.
          cp install-dependencies.bat startup.bat "$BUNDLE/"
          cp docs/user/user-guide.en.md docs/user/user-guide.hu.md "$BUNDLE/docs/"
          if [ -f CHANGELOG.md ]; then cp CHANGELOG.md "$BUNDLE/"; fi

          # A standalone manifest holding only the backend's runtime dependencies, so
          # install-dependencies.bat installs the minimum and nothing workspace-related. The
          # "engines" field here is what install-dependencies.bat reads its own Node version floor
          # from — keep it in sync with .nvmrc, not with a number hand-copied into the script.
          node -e "
            const fs = require('node:fs');
            const backend = JSON.parse(fs.readFileSync('backend/package.json', 'utf8'));
            const nvmrc = fs.readFileSync('.nvmrc', 'utf8').trim();
            const deps = { ...backend.dependencies, '@cdf/shared': 'file:./shared' };
            fs.writeFileSync('$BUNDLE/package.json', JSON.stringify({
              name: 'chicken-dinner-feed',
              version: process.env.VERSION,
              private: true,
              type: 'module',
              engines: { node: '>=' + nvmrc },
              scripts: { start: 'node backend/dist/index.js' },
              dependencies: Object.fromEntries(Object.entries(deps).sort()),
            }, null, 2) + '\n');
          "

          # Generate a lockfile for the bundle so 'npm ci' is reproducible on the operator's machine.
          (cd "$BUNDLE" && npm install --package-lock-only --omit=dev)

          # A short pointer; the full guides are in docs/.
          cat > "$BUNDLE/README.txt" <<EOF
          chicken-dinner-feed $VERSION

          1. Run install-dependencies.bat once (needs internet). Safe to run again after an
             update — it only installs when something has actually changed.
          2. Run startup.bat before each broadcast, and leave the window open.

          Full instructions: docs/user-guide.en.md  |  docs/user-guide.hu.md
          EOF

      # The single most valuable check available before anything is published: does the bundle
      # actually install and boot, using nothing but what is inside it plus a bare Node install —
      # exactly what install-dependencies.bat and startup.bat do on the operator's machine. Catching
      # a broken bundle here costs two minutes of CI time; catching it after publishing costs an
      # operator a broadcast.
      # Runs against a COPY, never the bundle directory itself. Installing and booting the app
      # necessarily writes things into it — node_modules, a log file, and (found the hard way,
      # after v1.0.0 shipped with all three) backend/data/*.json seeded by the app's own
      # first-run config bootstrap. A copy means the smoke test can be exactly as thorough as it
      # needs to be without a matching, ever-growing list of exactly what to clean up afterward —
      # there is nothing to clean up, because nothing about the shipped bundle ever changes.
      - name: Smoke-test a copy of the bundle — install, boot, health-check, audit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE="bundle/chicken-dinner-feed-$VERSION"
          SMOKE="smoke-test/chicken-dinner-feed-$VERSION"
          mkdir -p smoke-test
          cp -r "$BUNDLE" "$SMOKE"

          echo "::group::npm ci (as install-dependencies.bat would run it)"
          (cd "$SMOKE" && npm ci --omit=dev)
          echo "::endgroup::"

          echo "::group::npm audit (only this bundle's runtime dependencies)"
          (cd "$SMOKE" && npm audit --omit=dev --audit-level=high)
          echo "::endgroup::"

          echo "::group::Boot the server (as startup.bat would run it)"
          # NODE_ENV=production is not optional here: startup.bat always sets it, and without it
          # Fastify's logger reaches for the pino-pretty transport, which is a devDependency and is
          # not in this bundle's node_modules (--omit=dev above) — the process crashes on the very
          # first log line. Found by running this smoke test locally before it ever reached CI.
          (cd "$SMOKE" && NODE_ENV=production PORT=4317 node backend/dist/index.js > server.log 2>&1 &)
          SERVER_OK=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4317/api/health >/tmp/health.json 2>/dev/null; then
              SERVER_OK=1
              break
            fi
            sleep 1
          done
          echo "::endgroup::"

          if [ "$SERVER_OK" -ne 1 ]; then
            echo "::error::The bundle did not answer /api/health within 30s."
            echo "--- server.log ---"
            cat "$SMOKE/server.log" || true
            exit 1
          fi

          echo "Health check passed:"
          cat /tmp/health.json
          pkill -f "backend/dist/index.js" || true

          # The bundle that will actually be zipped must be byte-for-byte what "Assemble bundle"
          # produced — this is the check that would have caught v1.0.0 shipping node_modules and a
          # seeded backend/data, rather than trusting that nothing here touched it.
          if ! diff -rq "$BUNDLE" "$SMOKE" \
               -x node_modules -x package-lock.json -x server.log \
               -x overlay-instances.json -x scoring-ruleset.json -x custom-fonts.json \
               -x team-roster.json; then
            echo "::error::The smoke test changed files outside the paths it is allowed to touch."
            exit 1
          fi

      - name: Create ZIP
        id: zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd bundle
          ZIP_NAME="chicken-dinner-feed-$VERSION.zip"
          zip -rq "../$ZIP_NAME" "chicken-dinner-feed-$VERSION"
          cd ..
          sha256sum "$ZIP_NAME" > "$ZIP_NAME.sha256"
          echo "path=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$ZIP_NAME.sha256" >> "$GITHUB_OUTPUT"
          echo "checksum=$(cut -d' ' -f1 "$ZIP_NAME.sha256")" >> "$GITHUB_OUTPUT"

      # Defense in depth: verify the artifact actually being published, not just the directory
      # that was supposed to become it. A future change that re-introduces node_modules, a stray
      # log file, or an operator-config file seeded by booting the app (all three shipped in
      # v1.0.0, from the smoke test having run against the bundle itself rather than a copy) fails
      # the release here instead of shipping.
      - name: Verify the ZIP contains nothing it should not
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          LISTING=$(unzip -l "${{ steps.zip.outputs.path }}")
          FOUND=0
          for PATTERN in '/node_modules/' '/server\.log$' \
                         '/backend/data/overlay-instances\.json$' '/backend/data/scoring-ruleset\.json$' \
                         '/backend/data/custom-fonts\.json$' '/backend/data/team-roster\.json$'; do
            if echo "$LISTING" | grep -qE "$PATTERN"; then
              echo "::error::The published ZIP contains something matching '$PATTERN'."
              echo "$LISTING" | grep -E "$PATTERN" | head -10
              FOUND=1
            fi
          done
          if [ "$FOUND" -ne 0 ]; then
            echo "::error::Refusing to publish."
            exit 1
          fi
          echo "Confirmed: the ZIP contains none of the known contamination this bundle has shipped before."

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.zip.outputs.path }}
            ${{ steps.zip.outputs.checksum_path }}
          body: |
            ## Installation

            1. Download and unpack `${{ steps.zip.outputs.path }}`.
            2. Run `install-dependencies.bat` once — it needs an internet connection.
            3. Run `startup.bat` to start the app, and leave the console window open.

            Requires **Node.js 22 or newer** (<https://nodejs.org/>). Nothing else needs to be
            installed — `install-dependencies.bat` fetches the app's own dependencies for you.

            **SHA-256:** `${{ steps.zip.outputs.checksum }}`

            Upgrading? Unpack into a new folder, run `install-dependencies.bat` there, then copy
            your old `backend\data` folder across to keep your configuration.

            See `CHANGELOG.md` in the ZIP for what changed.
